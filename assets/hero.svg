<svg viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gliss — Sovereign Intelligence Engine for Product Trade-offs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#050b09"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="dialGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- faint spatial grid, referencing the app's 3D reasoning space -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
  </g>

  <!-- glass panel border -->
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- wordmark -->
  <text x="64" y="168" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="72" fill="url(#titleGrad)">✦ Gliss</text>

  <text x="66" y="206" font-family="'SFMono-Regular', Consolas, monospace" font-size="14" letter-spacing="3" fill="#10b981" opacity="0.9">SOVEREIGN INTELLIGENCE ENGINE FOR PRODUCT TRADE-OFFS</text>

  <text x="66" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.65">
    <tspan x="66" dy="0">3D spatial reasoning over your product constraints.</tspan>
    <tspan x="66" dy="26">Feed it a goal and a limit. It finds the contradiction.</tspan>
  </text>

  <!-- CTA row rendered as plain text, real links live in markdown below -->
  <text x="66" y="330" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" letter-spacing="1" fill="#06b6d4">↳ npm install · npm run dev</text>

  <!-- Right side: conflict severity dial, drawn from the app's actual scoring model -->
  <g transform="translate(950,190)">
    <circle r="130" fill="url(#dialGrad)"/>
    <circle r="96" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

    <!-- gauge arc, 0-10 scale, matches conflict_severity field -->
    <path d="M -96 0 A 96 96 0 1 1 96 0" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10" stroke-linecap="round"/>
    <path d="M -96 0 A 96 96 0 0 1 77.66 -56.43" fill="none" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>

    <!-- needle at severity 8/10 -->
    <g transform="rotate(54)">
      <line x1="0" y1="0" x2="0" y2="-84" stroke="#ffffff" stroke-width="2"/>
      <circle r="5" fill="#ffffff"/>
    </g>

    <text x="0" y="6" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="26" fill="#ffffff" font-weight="bold">8/10</text>
    <text x="0" y="30" text-anchor="middle" font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="2" fill="#ffffff" opacity="0.55">CONFLICT SEVERITY</text>
  </g>

  <!-- three trade-off bars, matching the app's Feasibility / Risk / Velocity scoring -->
  <g font-family="'SFMono-Regular', Consolas, monospace" font-size="11" letter-spacing="1.5">
    <g transform="translate(64,368)">
      <text x="0" y="-8" fill="#ffffff" opacity="0.55">FEASIBILITY</text>
      <rect x="0" y="0" width="180" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="0" width="126" height="6" rx="3" fill="#10b981"/>
    </g>
    <g transform="translate(320,368)">
      <text x="0" y="-8" fill="#ffffff" opacity="0.55">RISK</text>
      <rect x="0" y="0" width="180" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="0" width="153" height="6" rx="3" fill="#EF4444"/>
    </g>
    <g transform="translate(576,368)">
      <text x="0" y="-8" fill="#ffffff" opacity="0.55">VELOCITY</text>
      <rect x="0" y="0" width="180" height="6" rx="3" fill="#ffffff" opacity="0.1"/>
      <rect x="0" y="0" width="72" height="6" rx="3" fill="#06b6d4"/>
    </g>
  </g>
</svg>
